    - stage:
        name: Deploy to SIT
        identifier: Deploy_to_SIT
        description: Rolling deployment to CIBC SIT with smoke test
        type: Deployment
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: Simplii_Sample
          environment:
            environmentRef: CIBC_SIT
            deployToAll: false
            infrastructureDefinitions:
              - identifier: Simplii_SIT
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: Ensure Namespace
                  identifier: Ensure_Namespace
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: kubectl create namespace <+infra.namespace> --dry-run=client -o yaml | kubectl apply -f -
                    environmentVariables: []
                    outputVariables: []
                    delegateSelectors:
                      - se-sandbox-org-delegate
                  timeout: 5m
              - step:
                  name: Rolling Deployment
                  identifier: rollingDeployment
                  type: K8sRollingDeploy
                  timeout: 10m
                  spec:
                    skipDryRun: false
                    pruningEnabled: false
              - step:
                  type: ShellScript
                  name: Smoke Test
                  identifier: Smoke_Test
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |-
                          #!/bin/bash
                          SERVICE_NAME="$(echo "<+service.name>" | tr ' _' '--' | tr '[:upper:]' '[:lower:]')-service"
                          NAMESPACE="<+infra.namespace>"
                          TIMEOUT=300

                          echo "Waiting for LoadBalancer IP for: ${SERVICE_NAME} in namespace: ${NAMESPACE}"
                          START_TIME=$(date +%s)
                          EXTERNAL_IP=""
                          while [ -z "${EXTERNAL_IP}" ] || [ "${EXTERNAL_IP}" = "<none>" ] || [ "${EXTERNAL_IP}" = "<pending>" ]; do
                            EXTERNAL_IP=$(kubectl get svc "${SERVICE_NAME}" -n "${NAMESPACE}" -o wide 2>/dev/null | awk 'NR==2 {print $4}')
                            ELAPSED=$(($(date +%s) - START_TIME))
                            if [ ${ELAPSED} -ge ${TIMEOUT} ]; then
                              echo "Timeout after ${TIMEOUT}s"
                              exit 1
                            fi
                            if [ -z "${EXTERNAL_IP}" ] || [ "${EXTERNAL_IP}" = "<none>" ] || [ "${EXTERNAL_IP}" = "<pending>" ]; then
                              echo "Waiting... (${ELAPSED}s)"
                              sleep 10
                            fi
                          done
                          ENDPOINT="http://${EXTERNAL_IP}"
                          echo "Endpoint: ${ENDPOINT}"

                          # Smoke test: the home page and the API must both return 200
                          for path in / /api/info; do
                            CODE=""
                            for i in $(seq 1 18); do
                              CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "${ENDPOINT}${path}")
                              [ "${CODE}" = "200" ] && break
                              echo "GET ${path} -> ${CODE}, retrying..."
                              sleep 10
                            done
                            echo "GET ${path} -> ${CODE}"
                            if [ "${CODE}" != "200" ]; then
                              echo "Smoke test failed for ${path}"
                              exit 1
                            fi
                          done
                          API_RESPONSE=$(curl -s --max-time 5 "${ENDPOINT}/api/info")
                          echo "API response: ${API_RESPONSE}"

                          SMOKE_TEST_RESULTS=$(cat <<EOF
                          h1. 💨 <+env.name> Smoke Test Report
                          *Application URL:* [${ENDPOINT}/|${ENDPOINT}/]
                          *Artifact:* <+artifact.image>

                          ||Check||Result||
                          |GET /|200 OK|
                          |GET /api/info|200 OK|

                          h3. API Response
                          {code}
                          ${API_RESPONSE}
                          {code}
                          ----
                          _Generated by Harness Pipeline_
                          EOF
                          )
                          echo "$SMOKE_TEST_RESULTS"

                          export EXTERNAL_IP
                          export SMOKE_TEST_RESULTS
                    environmentVariables: []
                    outputVariables:
                      - name: EXTERNAL_IP
                        type: String
                        value: EXTERNAL_IP
                      - name: SMOKE_TEST_RESULTS
                        type: String
                        value: SMOKE_TEST_RESULTS
                    delegateSelectors:
                      - se-sandbox-org-delegate
                  timeout: 10m
              - step:
